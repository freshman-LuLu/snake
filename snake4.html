<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇小游戏</title>
    <style>
        :root {
            --neon-green: #00ff88;
            --neon-green-soft: #4ade80;
            --neon-red: #ff3860;
            --neon-gold: #ffd700;
            --neon-blue: #4fc3f7;
            --border-dim: #1f3a4a;
            --text-dim: #6b7b8c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
        }

        body {
            background: radial-gradient(ellipse at center, #0d1220 0%, #06080f 70%);
            color: #c8d0dc;
            font-family: "JetBrains Mono", "Fira Code", Consolas, "Courier New", monospace;
            font-size: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

            body::before {
                content: "";
                position: fixed;
                inset: 0;
                background: radial-gradient(circle at 20% 20%, rgba(0, 255, 136, 0.06), transparent 40%), radial-gradient(circle at 80% 80%, rgba(255, 56, 96, 0.05), transparent 40%);
                pointer-events: none;
                z-index: 0;
            }

        .container {
            position: relative;
            z-index: 1;
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        #app {
            white-space: pre;
            line-height: 1.35;
            letter-spacing: 0;
            user-select: none;
            padding: 28px 36px;
            background: rgba(8, 14, 24, 0.75);
            border: 1px solid rgba(0, 255, 136, 0.18);
            border-radius: 14px;
            box-shadow: 0 0 40px rgba(0, 255, 136, 0.08), 0 0 100px rgba(0, 255, 136, 0.04), inset 0 0 30px rgba(0, 255, 136, 0.03);
            backdrop-filter: blur(4px);
            animation: fadeIn 0.5s ease-out;
        }

        #scores {
            width: 280px;
            padding: 28px 22px;
            background: rgba(8, 14, 24, 0.75);
            border: 1px solid rgba(0, 255, 136, 0.18);
            border-radius: 14px;
            box-shadow: 0 0 40px rgba(0, 255, 136, 0.08), 0 0 100px rgba(0, 255, 136, 0.04), inset 0 0 30px rgba(0, 255, 136, 0.03);
            backdrop-filter: blur(4px);
            animation: fadeIn 0.5s ease-out;
            user-select: none;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .board {
            color: #d0d8e4;
        }

        .snake-head {
            color: var(--neon-green);
            font-weight: bold;
            text-shadow: 0 0 6px var(--neon-green), 0 0 12px rgba(0, 255, 136, 0.5);
        }

        .snake-body {
            color: var(--neon-green-soft);
            text-shadow: 0 0 4px rgba(74, 222, 128, 0.5);
        }

        .food {
            color: var(--neon-red);
            font-weight: bold;
            text-shadow: 0 0 8px var(--neon-red), 0 0 16px rgba(255, 56, 96, 0.6);
            animation: pulse 0.9s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                filter: brightness(1);
            }

            50% {
                opacity: 0.75;
                filter: brightness(1.3);
            }
        }

        .border {
            color: var(--border-dim);
            text-shadow: 0 0 4px rgba(31, 58, 74, 0.5);
        }

        .title {
            color: var(--neon-gold);
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.5);
            font-weight: bold;
        }

        .header {
            color: var(--neon-blue);
            text-shadow: 0 0 6px rgba(79, 195, 247, 0.4);
            font-weight: bold;
        }

        .win {
            color: var(--neon-green);
            text-shadow: 0 0 8px rgba(0, 255, 136, 0.5);
            font-weight: bold;
        }

        .lose {
            color: var(--neon-red);
            text-shadow: 0 0 8px rgba(255, 56, 96, 0.5);
            font-weight: bold;
        }

        .info {
            color: var(--neon-gold);
            text-shadow: 0 0 6px rgba(255, 215, 0, 0.4);
        }

        .tip {
            color: var(--text-dim);
        }

        .welcome-title {
            color: var(--neon-gold);
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.6);
            font-weight: bold;
        }

        .welcome-line {
            color: rgba(79, 195, 247, 0.4);
        }

        .hint-key {
            color: var(--neon-green);
            font-weight: bold;
        }

        .panel-title {
            font-size: 16px;
            color: var(--neon-gold);
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.5);
            font-weight: bold;
            letter-spacing: 2px;
            text-align: center;
            padding-bottom: 12px;
            margin-bottom: 12px;
            border-bottom: 1px solid rgba(0, 255, 136, 0.15);
        }

            .panel-title::before,
            .panel-title::after {
                content: "◆";
                color: var(--neon-green);
                margin: 0 8px;
                text-shadow: 0 0 6px var(--neon-green);
                font-size: 12px;
            }

        .score-table {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .score-row {
            display: grid;
            grid-template-columns: 36px 1fr 46px 52px;
            gap: 6px;
            padding: 7px 10px;
            border-radius: 6px;
            font-size: 14px;
            align-items: center;
            transition: all 0.2s;
        }

            .score-row.header {
                color: var(--neon-blue);
                font-weight: bold;
                font-size: 13px;
                letter-spacing: 1px;
                padding: 4px 10px;
                border-bottom: 1px dashed rgba(79, 195, 247, 0.25);
                margin-bottom: 4px;
                text-shadow: 0 0 6px rgba(79, 195, 247, 0.4);
            }

            .score-row.data.win {
                color: var(--neon-green);
                background: rgba(0, 255, 136, 0.06);
                border-left: 2px solid var(--neon-green);
            }

                .score-row.data.win:hover {
                    background: rgba(0, 255, 136, 0.12);
                    box-shadow: 0 0 12px rgba(0, 255, 136, 0.2);
                }

            .score-row.data.lose {
                color: var(--neon-red);
                background: rgba(255, 56, 96, 0.06);
                border-left: 2px solid var(--neon-red);
            }

                .score-row.data.lose:hover {
                    background: rgba(255, 56, 96, 0.12);
                    box-shadow: 0 0 12px rgba(255, 56, 96, 0.2);
                }

            .score-row.data .col-result {
                font-weight: bold;
                text-shadow: 0 0 6px currentColor;
            }

            .score-row.data .col-idx {
                color: var(--text-dim);
            }

        .score-empty {
            color: var(--text-dim);
            text-align: center;
            padding: 24px 0;
            font-size: 14px;
            letter-spacing: 1px;
        }

            .score-empty::before {
                content: "◌ ";
                color: var(--neon-green);
                opacity: 0.5;
            }
    </style>
</head>
<body>
    <div class="container">
        <div id="app"></div>
        <aside id="scores"></aside>
    </div>

    <script>
        const WIDTH = 40;
        const HEIGHT = 20;
        const SCORE_FILE = "snake_scores.txt";
        const MAX_RECORDS = 10;
        const WIN_LEN = 15;

        let snakeX = new Array(100).fill(0);
        let snakeY = new Array(100).fill(0);
        let len = 3;
        let foodX = 0, foodY = 0;
        let dir = 2;
        let gameOver = 0;
        let win = 0;

        let screen = 'welcome';
        let endMessage = '';

        let gameStartTime = 0;

        const app = document.getElementById('app');
        const scoresEl = document.getElementById('scores');

        function loadScoreRecords() {
        try {
        const raw = sessionStorage.getItem(SCORE_FILE);
        if (!raw) return [];
        const arr = JSON.parse(raw);
        if (!Array.isArray(arr)) return [];
        return arr.slice(-MAX_RECORDS);
        } catch (e) {
        return [];
        }
        }

        function saveScoreRecords(records) {
        const trimmed = records.slice(-MAX_RECORDS);
        try {
        sessionStorage.setItem(SCORE_FILE, JSON.stringify(trimmed));
        } catch (e) {}
        }

        function cleanupScoreFile() {
        try { sessionStorage.removeItem(SCORE_FILE); } catch (e) {}
        }

        window.addEventListener('beforeunload', cleanupScoreFile);

        function formatTime(ms) {
        if (ms == null || ms <= 0) return '--';
        const totalSec = ms / 1000;
        if (totalSec < 60) {
        return totalSec.toFixed(1) + 's';
        }
        const m = Math.floor(totalSec / 60);
        const s = Math.floor(totalSec % 60);
        return m + 'm' + (s < 10 ? '0' : '') + s + 's';
        }

        function renderScorePanel() {
        const records = loadScoreRecords();
        let html = '';
        html += '<div class="panel-title">历史成绩</div>';
        html += '<div class="score-table">';
        html += '<div class="score-row header">'
        + '<span>序号</span>'
        + '<span>用时</span>'
        + '<span>长度</span>'
        + '<span>结果</span>'
        + '</div>';

        if (records.length === 0) {
        html += '<div class="score-empty">暂无历史成绩</div>';
        } else {
        records.forEach((r, i) => {
        const cls = r.win ? 'win' : 'lose';
        const result = r.win ? '胜利' : '失败';
        const timeStr = formatTime(r.time);
        html += `<div class="score-row data ${cls}">`
        + `<span class="col-idx">${i + 1}</span>`
        + `<span class="col-time">${timeStr}</span>`
        + `<span class="col-len">${r.len}</span>`
        + `<span class="col-result">${result}</span>`
        + '</div>';
        });
        }
        html += '</div>';
        scoresEl.innerHTML = html;
        }

        function SaveScore(newLen, newWin, newTime) {
        const records = loadScoreRecords();
        records.push({ len: newLen, win: newWin, time: newTime });
        saveScoreRecords(records.slice(-MAX_RECORDS));
        }

        function InitGame() {
        gameOver = 0;
        dir = 2;
        snakeX[0] = Math.floor(WIDTH / 2);
        snakeY[0] = Math.floor(HEIGHT / 2);
        snakeX[1] = Math.floor(WIDTH / 2) - 1;
        snakeY[1] = Math.floor(HEIGHT / 2);
        snakeX[2] = Math.floor(WIDTH / 2) - 2;
        snakeY[2] = Math.floor(HEIGHT / 2);

        foodX = Math.floor(Math.random() * (WIDTH - 4)) + 3;
        foodY = Math.floor(Math.random() * (HEIGHT - 4)) + 2;
        }

        function Draw() {
        let html = '<span class="board">';
        html += '<span class="border">' + '#'.repeat(WIDTH + 2) + '</span>\n';

        for (let y = 0; y < HEIGHT; y++) {
        for (let x = 0; x < WIDTH + 2; x++) {
        if (x === 0 || x === WIDTH + 1) {
        html += '<span class="border">#</span>';
        } else if (x === snakeX[0] && y === snakeY[0]) {
        html += '<span class="snake-head">O</span>';
        } else if (x === foodX && y === foodY) {
        html += '<span class="food">F</span>';
        } else {
        let isBody = false;
        for (let i = 1; i < len; i++) {
        if (snakeX[i] === x && snakeY[i] === y) {
        html += '<span class="snake-body">o</span>';
        isBody = true;
        break;
        }
        }
        if (!isBody) html += ' ';
        }
        }
        html += '\n';
        }

        html += '<span class="border">' + '#'.repeat(WIDTH + 2) + '</span>\n';
        html += `<span class="info">  长度：${len}</span>\n`;
        html += '</span>';
        return html;
        }

        function handleKey(key) {
        switch (key) {
        case 'w': if (dir !== 3) dir = 1; break;
        case 'd': if (dir !== 4) dir = 2; break;
        case 's': if (dir !== 1) dir = 3; break;
        case 'a': if (dir !== 2) dir = 4; break;
        case 'x': gameOver = 1; break;
        }
        }

        function Logic() {
        for (let i = len - 1; i > 0; i--) {
        snakeX[i] = snakeX[i - 1];
        snakeY[i] = snakeY[i - 1];
        }

        switch (dir) {
        case 1: snakeY[0]--; break;
        case 2: snakeX[0]++; break;
        case 3: snakeY[0]++; break;
        case 4: snakeX[0]--; break;
        }

        if (snakeX[0] <= 0 || snakeX[0] >= WIDTH + 1 || snakeY[0] <= 0 || snakeY[0] >= HEIGHT)
        gameOver = 1;

        for (let i = 1; i < len; i++) {
        if (snakeX[0] === snakeX[i] && snakeY[0] === snakeY[i])
        gameOver = 1;
        }

        if (snakeX[0] === foodX && snakeY[0] === foodY) {
        len++;
        if (len >= 15) {
        gameOver = 1;
        win = 1;
        }
        foodX = Math.floor(Math.random() * (WIDTH - 4)) + 3;
        foodY = Math.floor(Math.random() * (HEIGHT - 4)) + 2;
        }
        }

        function renderWelcome() {
        let html = '';
        html += `<span class="welcome-line">===========================================================</span>\n`;
        html += `<span class="welcome-title">                 欢迎来到贪吃蛇小游戏</span>\n`;
        html += `<span class="welcome-line">===========================================================</span>\n`;
        html += `  <span class="tip">本游戏只可以通过英文输入状态下小写的</span><span class="hint-key">wsad</span><span class="tip">控制，</span><span class="hint-key">X</span><span class="tip">退出游戏</span>\n`;
        html += `                  <span class="info">贪吃蛇长度达到 15 获胜</span>\n`;
        html += `                <span class="tip">贪吃蛇会随着获取食物而加速</span>\n`;
        html += `<span class="welcome-line">===========================================================</span>\n`;
        html += `<span class="tip">请仔细阅读游戏规则，按下 </span><span class="hint-key">Y</span><span class="tip"> 键以开始游戏，按下其他键退出游戏...</span>\n`;
        app.innerHTML = html;
        }

        function renderEnd() {
        let html = Draw();
        html += '\n';
        if (win === 0) {
        html += `<span class="lose">游戏结束！最终长度：${len}</span>\n`;
        } else {
        html += `<span class="win">恭喜你，你赢了！最终长度：${len}</span>\n`;
        }
        html += `<span class="tip">按 </span><span class="hint-key">R</span><span class="tip"> 重新开始游戏...</span>\n`;
        app.innerHTML = html;
        }

        function sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
        }

        let gameLoopRunning = false;

        async function gameLoop() {
        if (gameLoopRunning) return;
        gameLoopRunning = true;
        try {
        while (!gameOver) {
        app.innerHTML = Draw();
        const waitMs = Math.max(0, 100 - len * 3);
        await sleep(waitMs);
        if (gameOver) break;
        Logic();
        }

        const elapsed = Date.now() - gameStartTime;

        screen = 'end';
        if (win === 0) {
        SaveScore(len, 0, elapsed);
        endMessage = `游戏结束！最终长度：${len}`;
        } else {
        SaveScore(len, 1, elapsed);
        endMessage = `恭喜你，你赢了！最终长度：${len}`;
        }
        renderScorePanel();
        renderEnd();
        } finally {
        gameLoopRunning = false;
        }
        }

        function startNewGame() {
        len = 3;
        win = 0;
        InitGame();
        gameStartTime = Date.now();
        screen = 'playing';
        renderScorePanel();
        gameLoop();
        }

        document.addEventListener('keydown', (e) => {
        if (['w','a','s','d','x','y','r'].includes(e.key.toLowerCase())) {
        e.preventDefault();
        }
        const k = e.key.toLowerCase();

        if (screen === 'welcome') {
        if (k === 'y') {
        startNewGame();
        } else {
        cleanupScoreFile();
        app.innerHTML = '<span class="tip">游戏已退出，可关闭页面。</span>\n';
        screen = 'exit';
        }
        return;
        }

        if (screen === 'playing') {
        handleKey(k);
        return;
        }

        if (screen === 'end') {
        if (k === 'r') {
        startNewGame();
        }
        return;
        }
        });

        renderWelcome();
        renderScorePanel();
    </script>
</body>
</html>
